<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Emerald to Teal) matching in-app logo -->
    <linearGradient id="apiro-bg-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    
    <!-- Subtle Inner Border Highlight -->
    <linearGradient id="apiro-border-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Drop Shadow for Origami Dart -->
    <filter id="apiro-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>

    <!-- Crisp Dart Gradient -->
    <linearGradient id="apiro-dart-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#apiro-bg-grad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#apiro-border-grad)" stroke-width="4" />

  <!-- Origami Navigation Dart (Exact In-App Brand Icon) -->
  <g transform="translate(64, 64) scale(16)" filter="url(#apiro-shadow)">
    <path d="M12 2L2 22L12 17L22 22L12 2Z" fill="url(#apiro-dart-grad)" />
  </g>
</svg>
